server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lab_equipment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 敏感信息通过环境变量注入，勿把真实密码写进仓库
    # 本地开发：复制根目录 env.local.bat.example 为 env.local.bat 并填写 DB_PASSWORD
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印 SQL，生产可删除
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: ${JWT_SECRET:lab-equipment-secret-key-change-me-0123456789abcdef}
  expire-hours: 24

logging:
  level:
    com.lab.equipment: debug

# 设备资料库附件存储目录
app:
  upload-dir: ./uploads
